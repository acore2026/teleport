name: Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  webserver-image:
    name: Publish Webserver Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-clients:
    name: Build ${{ matrix.name }} Client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            command: npm run desktop:standalone:linux
            artifacts: |
              release-artifacts/*.tar.gz
          - name: windows
            os: windows-latest
            command: npm run desktop:standalone:windows
            artifacts: |
              release-artifacts/*.zip
          - name: macos-x64
            os: macos-13
            command: npm run desktop:standalone:macos:x64
            rust_target: x86_64-apple-darwin
            artifacts: |
              release-artifacts/*.tar.gz
          - name: macos-arm64
            os: macos-14
            command: npm run desktop:standalone:macos:arm64
            rust_target: aarch64-apple-darwin
            artifacts: |
              release-artifacts/*.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust target
        if: startsWith(matrix.name, 'macos-')
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install Linux desktop dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        if: matrix.name != 'windows'
        run: npm ci

      - name: Install Windows dependencies
        if: matrix.name == 'windows'
        run: npm install

      - name: Build client
        run: ${{ matrix.command }}

      - name: Package Linux standalone
        if: matrix.name == 'linux'
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/teleport-desktop release-artifacts/teleport
          chmod +x release-artifacts/teleport
          tar -C release-artifacts -czf release-artifacts/teleport-linux-x64-standalone.tar.gz teleport
          rm release-artifacts/teleport

      - name: Package Windows standalone
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/teleport-desktop.exe release-artifacts/teleport.exe
          Compress-Archive -Path release-artifacts/teleport.exe -DestinationPath release-artifacts/teleport-windows-x64-standalone.zip -Force
          Remove-Item release-artifacts/teleport.exe

      - name: Package macOS x64 standalone
        if: matrix.name == 'macos-x64'
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/x86_64-apple-darwin/release/teleport-desktop release-artifacts/teleport
          chmod +x release-artifacts/teleport
          tar -C release-artifacts -czf release-artifacts/teleport-macos-x64-standalone.tar.gz teleport
          rm release-artifacts/teleport

      - name: Package macOS arm64 standalone
        if: matrix.name == 'macos-arm64'
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/teleport-desktop release-artifacts/teleport
          chmod +x release-artifacts/teleport
          tar -C release-artifacts -czf release-artifacts/teleport-macos-arm64-standalone.tar.gz teleport
          rm release-artifacts/teleport

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: teleport-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [webserver-image, desktop-clients]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: teleport-*
          path: release-artifacts
          merge-multiple: true

      - name: Create release and upload clients
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "Docker image: \`$IMAGE\`"
          gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | \
            while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG_NAME" "$asset" --yes
            done
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          gh release upload "$TAG_NAME" "${files[@]}" --clobber
