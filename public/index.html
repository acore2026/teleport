<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paste List</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">private-by-name pasteboard</p>
          <h1>Paste List</h1>
        </div>
        <div class="session-card">
          <span id="connectionDot" class="dot" aria-hidden="true"></span>
          <span id="connectionLabel">offline</span>
          <span id="activeUser">no user</span>
        </div>
      </header>

      <section id="loginPanel" class="login-panel" aria-label="Sign in">
        <div>
          <p class="eyebrow">username auth</p>
          <h2>Choose a name to open your synced list.</h2>
        </div>
        <form id="loginForm" class="login-form">
          <input
            id="usernameInput"
            name="username"
            inputmode="text"
            autocomplete="username"
            placeholder="username"
            aria-label="Username"
            maxlength="40"
            required
          />
          <button type="submit">Enter</button>
        </form>
        <p id="loginError" class="form-error" role="alert"></p>
      </section>

      <section id="pasteApp" class="paste-app" aria-label="Paste list" hidden>
        <div class="capture-panel">
          <div>
            <p class="eyebrow">clipboard capture</p>
            <h2>Paste text below to add a new item.</h2>
          </div>
          <textarea
            id="pasteCapture"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            placeholder="Paste here..."
            aria-label="Paste capture"
          ></textarea>
          <div class="capture-footer">
            <span id="captureState">Waiting for paste</span>
            <button id="logoutButton" type="button">Switch user</button>
          </div>
        </div>

        <section class="list-panel" aria-label="Saved pastes">
          <div class="list-head">
            <div>
              <p class="eyebrow">your data</p>
              <h2><span id="pasteCount">0</span> active items</h2>
            </div>
            <span id="ttlLabel">expires after 1 day</span>
          </div>
          <ol id="pasteList" class="paste-list"></ol>
        </section>
      </section>
    </main>

    <template id="pasteItemTemplate">
      <li class="paste-item">
        <article>
          <header>
            <div>
              <strong class="paste-title"></strong>
              <span class="paste-meta"></span>
            </div>
            <div class="paste-actions">
              <button class="copy-button" type="button">Copy</button>
              <button class="delete-button" type="button">Delete</button>
            </div>
          </header>
          <pre class="paste-content"></pre>
        </article>
      </li>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
